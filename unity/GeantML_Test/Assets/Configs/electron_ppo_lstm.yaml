# ML-Agents Training Configuration - VERSION 6 PPO + LSTM
# RECURRENT POLICY: Learns temporal patterns in trajectories!
#
# WHY LSTM FOR THIS PROBLEM:
# - Remembers trajectory history (not just current state)
# - Can learn: "I have been straight for N steps, time to scatter"
# - Captures energy-time-scattering correlation
# - Better for sequential decision problems
#
# Usage:
#   mlagents-learn electron_ppo_lstm_v6.yaml --run-id=v6_lstm --force
#

behaviors:

  ElectronPhysics:
    trainer_type: ppo

    hyperparameters:
      batch_size: 1024
      buffer_size: 10240

      learning_rate: 1.0e-4
      learning_rate_schedule: linear

      beta: 0.12
      beta_schedule: linear

      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
      
      memory:
        memory_size: 128
        sequence_length: 64

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0

      curiosity:
        gamma: 0.99
        strength: 0.06
        network_settings:
          normalize: true
          hidden_units: 128
        learning_rate: 1.0e-4

    max_steps: 2000000
    time_horizon: 128
    summary_freq: 5000

    keep_checkpoints: 30
    checkpoint_interval: 50000

    threaded: false

  ElectronPhysics_Inference:
    trainer_type: ppo
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        memory_size: 128
        sequence_length: 64
    max_steps: 0
    time_horizon: 128

engine_settings:
  width: 84
  height: 84
  quality_level: 1
  time_scale: 15
  target_frame_rate: -1
  capture_frame_rate: 60

checkpoint_settings:
  run_id: v6_lstm
  initialize_from: null
  load_model: false
  resume: false
  force: false
  train_model: true
  inference: false