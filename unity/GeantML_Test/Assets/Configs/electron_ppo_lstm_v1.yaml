# ==============================================================================
# ML-Agents Training Configuration - PPO + LSTM v1
# ==============================================================================
# RECURRENT POLICY WITH LONG SHORT-TERM MEMORY
#
# Extends PPO with recurrent memory to learn temporal patterns.
# Agent remembers trajectory history and can learn sequential behaviors.
#
# Key features:
# - Recurrent neural network (LSTM) for temporal memory
# - Learns: "I scattered left recently, now scatter right"
# - Captures energy-time-scattering correlations
# - Better for sequential decision problems
#
# LSTM Configuration:
# - memory_size: 128 (hidden_state=64 + cell_state=64)
# - sequence_length: 64 (looks back 64 steps)
#
# Note: LSTM training is slower and doesn't support threaded mode.
#
# Usage:
#   mlagents-learn electron_ppo_lstm_v1.yaml --run-id=ppo_lstm_v1 --force
#
# ==============================================================================

behaviors:

  ElectronPhysics:
    trainer_type: ppo

    hyperparameters:
      batch_size: 1024
      buffer_size: 10240

      learning_rate: 1.0e-4
      learning_rate_schedule: linear

      beta: 0.12
      beta_schedule: linear

      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple

      memory:
        memory_size: 128
        sequence_length: 64

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0

      curiosity:
        gamma: 0.99
        strength: 0.06
        network_settings:
          normalize: true
          hidden_units: 128
        learning_rate: 1.0e-4

    max_steps: 1000000
    time_horizon: 128
    summary_freq: 5000

    keep_checkpoints: 25
    checkpoint_interval: 50000

    threaded: false

  ElectronPhysics_Inference:
    trainer_type: ppo
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      memory:
        memory_size: 128
        sequence_length: 64
    max_steps: 0
    time_horizon: 128

# ==============================================================================
# ENGINE CONFIGURATION
# ==============================================================================
engine_settings:
  width: 84
  height: 84
  quality_level: 1
  time_scale: 15
  target_frame_rate: -1
  capture_frame_rate: 60

# ==============================================================================
# CHECKPOINT SETTINGS
# ==============================================================================
checkpoint_settings:
  run_id: ppo_lstm_v1
  initialize_from: null
  load_model: false
  resume: false
  force: false
  train_model: true
  inference: false