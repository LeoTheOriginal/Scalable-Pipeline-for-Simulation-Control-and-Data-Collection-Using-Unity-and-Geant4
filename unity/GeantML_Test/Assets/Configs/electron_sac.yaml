# ML-Agents Training Configuration - VERSION 6 SAC
# SOFT ACTOR-CRITIC: Built-in entropy maximization!
#
# WHY SAC FOR THIS PROBLEM:
# - Automatic entropy tuning (no manual beta scheduling!)
# - Maximum entropy framework = natural exploration
# - Off-policy = more sample efficient
# - Excellent for continuous action spaces
#
# Usage:
#   mlagents-learn electron_sac_v6.yaml --run-id=v6_sac --force
#

behaviors:

  ElectronPhysics:
    trainer_type: sac

    hyperparameters:
      batch_size: 256
      buffer_size: 500000
      buffer_init_steps: 10000

      learning_rate: 3.0e-4
      learning_rate_schedule: constant

      tau: 0.005
      init_entcoef: 0.5
      steps_per_update: 10
      save_replay_buffer: false

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

      curiosity:
        gamma: 0.99
        strength: 0.05
        network_settings:
          normalize: true
          hidden_units: 128
        learning_rate: 3.0e-4

    max_steps: 2000000
    time_horizon: 256
    summary_freq: 5000

    keep_checkpoints: 30
    checkpoint_interval: 50000

  ElectronPhysics_Inference:
    trainer_type: sac
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    max_steps: 0
    time_horizon: 256

engine_settings:
  width: 84
  height: 84
  quality_level: 1
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60

checkpoint_settings:
  run_id: v6_sac
  initialize_from: null
  load_model: false
  resume: false
  force: false
  train_model: true
  inference: false