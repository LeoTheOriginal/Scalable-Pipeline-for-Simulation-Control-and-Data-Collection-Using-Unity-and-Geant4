behaviors:
  ElectronPhysics:
    trainer_type: sac  # ZMIANA: Algorytm SAC
    
    hyperparameters:
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      buffer_size: 50000        # SAC wymaga dużego bufora (Replay Buffer)
      buffer_init_steps: 1000   # Kroki na wypełnienie bufora przed nauką
      batch_size: 256           # Zazwyczaj mniejszy batch niż w PPO
      tau: 0.005                # Współczynnik aktualizacji (Soft Update)
      steps_per_update: 20.0    # Ile razy trenować sieć na krok symulacji
      save_replay_buffer: true
      init_entcoef: 0.1         # Entropia (eksploracja)

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0

    max_steps: 2000000          # SAC często zbiega szybciej (w sensie liczby kroków)
    time_horizon: 64            # Krótszy horyzont dla SAC
    summary_freq: 10000
    keep_checkpoints: 5
    checkpoint_interval: 50000

