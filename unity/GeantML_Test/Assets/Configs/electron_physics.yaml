# ML-Agents Training Configuration for Electron Transport
# 
# This configuration file defines multiple training setups for comparison:
# 1. PhysicsBased: Pure physics constraints, no trajectory matching
# 2. Experimental: Distribution learning with stochastic sampling
# 3. MultiAgent: Multiple agents for statistical validation
#
# Usage:
#   mlagents-learn config/electron_physics.yaml --run-id=physics_v1
#
# For multi-agent:
#   mlagents-learn config/electron_physics.yaml --run-id=multi_v1 --env-args="--multi-agent"

behaviors:

  # ============================================================================
  # PHYSICS-BASED TRAINING (RECOMMENDED)
  # ============================================================================
  # 
  # This is the recommended approach for your thesis:
  # - No trajectory matching with Geant4
  # - Rewards based purely on physics constraints
  # - Agent learns the underlying physics, not specific trajectories
  #
  ElectronPhysics:
    trainer_type: ppo
    
    # Hyperparameters tuned for physics learning
    hyperparameters:
      batch_size: 2048          # Larger batch for stable physics learning
      buffer_size: 20480        # ~10 batches
      learning_rate: 1.0e-4     # Conservative LR for physics
      learning_rate_schedule: linear
      beta: 0.01                # Entropy bonus (encourage exploration)
      epsilon: 0.2              # PPO clipping
      lambd: 0.95               # GAE lambda
      num_epoch: 4              # PPO epochs per update
    
    # Network architecture
    network_settings:
      normalize: true           # Important for physics observations
      hidden_units: 256         # Medium network
      num_layers: 3             # Deeper for physics relationships
      vis_encode_type: simple
      
    # Reward processing
    reward_signals:
      extrinsic:
        gamma: 0.995            # Long horizon for trajectory rewards
        strength: 1.0
    
    # Episode limits
    max_steps: 5000000          # 5M steps total
    time_horizon: 512           # Steps between updates
    summary_freq: 10000
    
    # Checkpointing
    keep_checkpoints: 5
    checkpoint_interval: 100000

  # ============================================================================
  # EXPERIMENTAL: DISTRIBUTION LEARNING
  # ============================================================================
  #
  # Agent learns to output parameters of scattering distribution
  # More aligned with Monte Carlo physics nature
  #
  ElectronDistribution:
    trainer_type: ppo
    
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 5.0e-5     # Lower LR for distribution learning
      learning_rate_schedule: linear
      beta: 0.02                # Higher entropy for distribution exploration
      epsilon: 0.15
      lambd: 0.95
      num_epoch: 3
    
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    
    max_steps: 3000000
    time_horizon: 256
    summary_freq: 10000

  # ============================================================================
  # MULTI-AGENT STATISTICAL VALIDATION
  # ============================================================================
  #
  # Train multiple agents simultaneously
  # Compare trajectory distributions across agents
  #
  ElectronMultiAgent:
    trainer_type: ppo
    
    hyperparameters:
      batch_size: 4096          # Larger batch for multiple agents
      buffer_size: 40960
      learning_rate: 1.0e-4
      learning_rate_schedule: linear
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 4
    
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
        
      # Optional: curiosity for exploration
      # curiosity:
      #   gamma: 0.99
      #   strength: 0.01
      #   network_settings:
      #     normalize: true
      #     hidden_units: 128
      #   learning_rate: 1.0e-4
    
    max_steps: 10000000         # More steps for multi-agent
    time_horizon: 512
    summary_freq: 10000
    
    # Self-play not applicable but could use team training
    # for comparing agent behaviors

  # ============================================================================
  # TRAJECTORY-LEVEL REWARDS ONLY
  # ============================================================================
  #
  # Rewards only applied at episode end
  # Forces agent to learn complete trajectory patterns
  #
  ElectronTrajectory:
    trainer_type: ppo
    
    hyperparameters:
      batch_size: 512           # Smaller batch (fewer episodes)
      buffer_size: 5120
      learning_rate: 3.0e-4     # Higher LR for sparse rewards
      learning_rate_schedule: constant
      beta: 0.005
      epsilon: 0.2
      lambd: 0.99               # Higher lambda for trajectory credit
      num_epoch: 6              # More epochs to extract signal
    
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      memory:                   # LSTM for trajectory memory
        memory_size: 128
        sequence_length: 64
        
    reward_signals:
      extrinsic:
        gamma: 0.999            # Very long horizon
        strength: 1.0
    
    max_steps: 5000000
    time_horizon: 1024          # Full episode
    summary_freq: 5000

# ============================================================================
# ENVIRONMENT SETTINGS
# ============================================================================
