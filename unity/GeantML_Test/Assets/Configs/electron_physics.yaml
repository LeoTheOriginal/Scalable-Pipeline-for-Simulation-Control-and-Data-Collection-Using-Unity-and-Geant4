# ============================================================================
# NOTES FOR YOUR THESIS
# ============================================================================
#
# Recommended training procedure:
#
# 1. First, train with ElectronPhysics configuration:
#    mlagents-learn config/electron_physics.yaml --run-id=physics_v1
#    
#    This will teach the agent basic physics constraints without
#    trying to match specific Geant4 trajectories.
#
# 2. Validate statistically with ElectronMultiAgent:
#    Run multiple agents and compare their trajectory distributions
#    against Geant4 Monte Carlo distributions.
#
# 3. Optional: Try ElectronDistribution for a more physics-aligned
#    approach where the agent learns scattering distributions.
#
# Key metrics to monitor in TensorBoard:
# - Environment/Cumulative Reward
# - Policy/Entropy (should decrease over time)
# - Losses/Policy Loss (should stabilize)
# - Custom: Path length distribution, energy depletion curve
#
# Expected training time:
# - 5M steps ≈ 2-4 hours on modern GPU
# - Convergence usually visible around 1-2M steps
#