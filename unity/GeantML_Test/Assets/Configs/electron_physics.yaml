# ML-Agents Training Configuration for Multi-Agent Electron Transport
# Updated for 14-dimensional observation space with anti-spiral rewards
#
# Usage:
#   mlagents-learn electron_physics.yaml --run-id=multi_agent_test_v1 --force
#
# Observation Space (13 dimensions):
#   1-3: Position (x, y, z) normalized
#   4-6: Momentum direction (x, y, z) normalized
#   7: Energy normalized
#   8: Remaining range normalized
#   9: Depth in phantom normalized
#   10: Path length fraction
#   11: Recent scattering mean
#   12: Recent scattering variance
#   13: Spiral indicator

behaviors:

  # ============================================================================
  # MULTI-AGENT ELECTRON TRANSPORT (GEANT4 STATISTICAL MODE)
  # ============================================================================
  #
  # This configuration is optimized for:
  # - Multiple agents training simultaneously (4 agents recommended)
  # - Statistical validation against Geant4 Monte Carlo
  # - Anti-spiral and anti-straight-line rewards
  # - Realistic scattering behavior
  #
  ElectronPhysics:
    trainer_type: ppo

    # Hyperparameters optimized for physics learning with multiple agents
    hyperparameters:
      batch_size: 2048          # Large batch for stable updates across agents
      buffer_size: 20480        # ~10 batches worth of experience
      learning_rate: 1.0e-4     # Conservative LR for physics
      learning_rate_schedule: linear  # Decay learning rate over time
      beta: 0.01                # Entropy coefficient (encourage exploration)
      epsilon: 0.2              # PPO clip range
      lambd: 0.95               # GAE lambda
      num_epoch: 4              # Number of passes through experience buffer

    # Network architecture
    network_settings:
      normalize: true           # CRITICAL: Normalize observations
      hidden_units: 256         # Sufficient capacity for physics
      num_layers: 3             # Deep enough to learn complex relationships
      vis_encode_type: simple   # No visual observations

    # Reward configuration
    reward_signals:
      extrinsic:
        gamma: 0.995            # Discount factor (long horizon for trajectories)
        strength: 1.0           # Extrinsic reward scale

      # Optional: Curiosity-driven exploration
      # Uncomment if agents get stuck in local minima
      # curiosity:
      #   gamma: 0.99
      #   strength: 0.005       # Small curiosity bonus
      #   network_settings:
      #     normalize: true
      #     hidden_units: 128
      #   learning_rate: 1.0e-4

    # Training limits
    max_steps: 1000000          # 5M steps total (2-4 hours on modern GPU)
    time_horizon: 512           # Steps between policy updates
    summary_freq: 10000         # TensorBoard logging frequency

    # Checkpointing
    keep_checkpoints: 5         # Keep last 5 checkpoints
    checkpoint_interval: 100000  # Save every 50k steps

    # Self-play configuration (not used for electron transport)
    # self_play: null

    # Behavioral cloning (not used for this project)
    # behavioral_cloning: null

  # ============================================================================
  # INFERENCE MODE (For Evaluation After Training)
  # ============================================================================
  #
  # Use this configuration with trained model for inference-only evaluation
  # Set agents to Mode: Inference and load .onnx model
  #
  ElectronPhysics_Inference:
    trainer_type: ppo

    # Same network architecture as training
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3

    # No training, just inference
    max_steps: 0
    time_horizon: 512
    summary_freq: 10000

# ============================================================================
# ENVIRONMENT PARAMETERS
# ============================================================================
#
# Optional: Curriculum learning to gradually increase difficulty
#
# environment_parameters:
#   # Start with easier physics (fewer steps required)
#   max_episode_steps:
#     curriculum:
#       - name: EasyPhysics
#         completion_criteria:
#           measure: reward
#           behavior: ElectronPhysics
#           signal_smoothing: true
#           min_lesson_length: 100
#           threshold: 0.0        # Move to next lesson when reward > 0
#         value: 300              # Start with shorter episodes
#       - name: NormalPhysics
#         value: 500              # Full episode length

# ============================================================================
# ENGINE CONFIGURATION
# ============================================================================
#
# These settings control the ML-Agents Python trainer
#
engine_settings:
  width: 84                     # Rendering width (if using camera)
  height: 84                    # Rendering height
  quality_level: 5              # Unity quality setting
  time_scale: 20                # Speed up training (20x faster than real-time)
  target_frame_rate: -1         # Unlimited FPS
  capture_frame_rate: 60        # For recording only

# ============================================================================
# CHECKPOINT SETTINGS
# ============================================================================
checkpoint_settings:
  run_id: multi_agent_test      # Will be overridden by --run-id flag
  initialize_from: null         # Set to path for transfer learning
  load_model: false             # Load existing model
  resume: false                 # Resume training
  force: false                  # Overwrite existing run
  train_model: true             # Enable training
  inference: false              # Inference mode

# ============================================================================
# TENSORBOARD SETTINGS
# ============================================================================
#
# View results: tensorboard --logdir=results
#
# Key metrics to monitor:
# - Environment/Cumulative Reward (should increase to +150-250)
# - Environment/Episode Length (should stabilize around 250-350 steps)
# - Policy/Entropy (should slowly decrease)
# - Losses/Policy Loss (should stabilize)
#
# Custom metrics logged by ElectronAgentPhysics:
# - Path length vs CSDA range
# - Scattering statistics (mean, std dev, spiral indicator)
# - Energy depletion curve
# - Geant4 statistical comparison (path, depth, lateral, scattering)

# ============================================================================
# NOTES FOR TRAINING
# ============================================================================
#
# 1. START TRAINING:
#    mlagents-learn electron_physics.yaml --run-id=my_experiment --force
#
# 2. MONITOR IN TENSORBOARD:
#    tensorboard --logdir=results
#    Open: http://localhost:6006
#
# 3. EXPECTED CONVERGENCE:
#    - 0-100k: Random exploration, reward ~ -300
#    - 100k-500k: Learning basic physics, reward ~ -50
#    - 500k-1M: Good trajectories, reward ~ +50 to +100
#    - 1M-3M: Refined behavior, reward ~ +150 to +200
#    - 3M+: Converged, reward ~ +200 to +250
#
# 4. MULTI-AGENT BENEFITS:
#    - 4 agents = 4x faster step accumulation
#    - Better gradient estimates (more diverse experience)
#    - Statistical validation across agents
#    - Demonstrates stochastic nature of learned policy
#
# 5. IF TRAINING STALLS:
#    - Check TensorBoard for entropy (should be decreasing)
#    - Verify agents aren't all exiting phantom (boundary penalty)
#    - Check for "straight line" behavior (enable verbose logging)
#    - Consider increasing W_ScatteringVariance or W_AntiSpiral
#    - Try enabling curiosity reward signal
#
# 6. HYPERPARAMETER TUNING:
#    - learning_rate: 5e-5 to 2e-4 (lower = more stable, higher = faster)
#    - batch_size: 1024 to 4096 (larger = more stable updates)
#    - beta: 0.005 to 0.02 (higher = more exploration)
#    - num_epoch: 3 to 6 (more epochs = more learning per batch)
#
# 7. FOR YOUR THESIS:
#    - Run multiple experiments with different reward weights
#    - Compare learning curves (TensorBoard screenshots)
#    - Analyze final trajectory statistics vs Geant4
#    - Measure inference speed (FPS) vs Geant4 simulation
#    - Document convergence time and computational resources
#
# ============================================================================
# TROUBLESHOOTING
# ============================================================================
#
# ERROR: "Observation space mismatch"
# FIX: Check Unity → Behavior Parameters → Space Size = 14
#
# ERROR: "Unable to connect to Unity"
# FIX: Make sure Unity is in Play mode, port 5004 is not blocked
#
# WARNING: "Reward is constant"
# CHECK: Agents might be stuck, enable verbose logging in Unity
#
# WARNING: "Policy loss exploding"
# FIX: Reduce learning rate or increase batch size
#
# ISSUE: "Training very slow"
# FIX: Disable Show Visualization, reduce agents, increase time_scale
#
# ISSUE: "All agents behave identically"
# EXPECTED: They share the same network, but stochastic actions differ
#
# ============================================================================

