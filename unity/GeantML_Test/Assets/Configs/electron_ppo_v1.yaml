# ==============================================================================
# ML-Agents Training Configuration - PPO v1
# ==============================================================================
# PROXIMAL POLICY OPTIMIZATION
#
# Base algorithm for electron transport simulation.
# Uses high entropy (beta) to encourage exploration of all scattering angles.
#
# Key features:
# - On-policy learning
# - Clipped surrogate objective for stable updates
# - High entropy to prevent mode collapse
# - Curiosity-driven exploration
#
# Usage:
#   mlagents-learn electron_ppo_v1.yaml --run-id=ppo_v1 --force
#
# Learning rate sensitivity experiments:
#   mlagents-learn electron_ppo_v1.yaml --run-id=ppo_lr_1e-4 --force \
#     behaviors.ElectronPhysics.hyperparameters.learning_rate=1.0e-4
#
#   mlagents-learn electron_ppo_v1.yaml --run-id=ppo_lr_1e-5 --force \
#     behaviors.ElectronPhysics.hyperparameters.learning_rate=1.0e-5
#
# ==============================================================================

behaviors:

  ElectronPhysics:
    trainer_type: ppo

    hyperparameters:
      batch_size: 4096
      buffer_size: 40960

      learning_rate: 5.0e-5
      learning_rate_schedule: linear

      beta: 0.15
      beta_schedule: constant

      epsilon: 0.25
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0

      curiosity:
        gamma: 0.99
        strength: 0.08
        network_settings:
          normalize: true
          hidden_units: 256
          num_layers: 2
        learning_rate: 3.0e-4

    max_steps: 1000000
    time_horizon: 1024
    summary_freq: 5000

    keep_checkpoints: 25
    checkpoint_interval: 50000

    threaded: true

  ElectronPhysics_Inference:
    trainer_type: ppo
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    max_steps: 0
    time_horizon: 512

# ==============================================================================
# ENGINE CONFIGURATION
# ==============================================================================
engine_settings:
  width: 84
  height: 84
  quality_level: 1
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60

# ==============================================================================
# CHECKPOINT SETTINGS
# ==============================================================================
checkpoint_settings:
  run_id: ppo_v1
  initialize_from: null
  load_model: false
  resume: false
  force: false
  train_model: true
  inference: false