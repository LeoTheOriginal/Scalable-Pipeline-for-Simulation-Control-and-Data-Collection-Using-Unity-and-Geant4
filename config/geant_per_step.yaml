behaviors:
  ParticleAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.0005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    # CRITICAL: Disable checkpoint saving to avoid ONNX export crash
    checkpoint_interval: 0  # 0 = never save checkpoints
    max_steps: 50
    time_horizon: 128
    summary_freq: 1000