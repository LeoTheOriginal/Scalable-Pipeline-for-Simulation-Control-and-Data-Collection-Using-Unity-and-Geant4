data_collection:
  file_format: hdf5
  max_samples_per_file: 1000
  output_directory: ./collected_data
data_processing:
  normalization_method: standard
  random_seed: 42
  shuffle: true
  test_split: 0.1
  train_split: 0.8
  validation_split: 0.1
geant4:
  default_num_events: 1000
  executable_path: ./geant4_sim
  output_directory: ./geant4_output
  timeout: 300
  working_directory: ./geant4_runs
logging:
  file: pipeline.log
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO
paths:
  data_dir: ./data
  logs_dir: ./logs
  models_dir: ./models
  results_dir: ./results
project:
  description: Scalable pipeline for simulation control and data collection
  name: Unity-Geant4-Pipeline
  version: 1.0.0
simulation:
  energy_range:
  - 1.0
  - 100.0
  energy_unit: MeV
  particle_types:
  - gamma
  - electron
  - proton
  phantom_materials:
  - Water
  - Bone
  - Tissue
  phantom_size:
  - 10.0
  - 10.0
  - 10.0
training:
  batch_size: 1024
  buffer_size: 10240
  checkpoint_interval: 50000
  gamma: 0.99
  hidden_units: 128
  learning_rate: 0.0003
  max_steps: 500000
  num_epochs: 3
  num_layers: 2
  summary_freq: 10000
  trainer_type: ppo
unity:
  base_port: 5005
  environment_path: null
  num_parallel_envs: 1
  time_scale: 20.0
  timeout_wait: 60
